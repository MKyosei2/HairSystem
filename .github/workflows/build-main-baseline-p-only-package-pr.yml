name: Build Main-Baseline P-Only Package PR

on:
  pull_request:
    branches:
      - Novelty01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONHASHSEED: "0"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: microsoft/setup-msbuild@v2

      - name: Verify Main ancestry and P-only routing
        shell: pwsh
        run: |
          git fetch origin main Novelty01
          git merge-base --is-ancestor origin/main HEAD
          if ($LASTEXITCODE -ne 0) { throw 'HEAD does not contain Main.' }
          $cpp = Get-Content 'apps/dx11_viewer/src/GpuHairViewer.cpp' -Raw
          foreach ($token in @(
            'ExecuteExperimentSimulationTickLegacy',
            'ExecuteNovelty01ExperimentTick',
            '16_segment_group_adaptive_payload_complete.inl',
            '17_novelty01_formal_evidence.inl',
            '18_novelty01_render_dirty_range_consumer.inl',
            '02a_required_runtime_foundation.inl')) {
            if (-not $cpp.Contains($token)) { throw "Missing token: $token" }
          }
          if ($cpp.Contains('#define private')) { throw 'Unsafe #define private remains.' }

      - name: Prepare Main-baseline P-only source
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'package_output'
          $stage = Join-Path $out 'HairSystem_Novelty01_MainBaseline_POnly'
          $tracked = Join-Path $out 'tracked.zip'
          New-Item -ItemType Directory -Force $out | Out-Null
          git archive --format=zip --output=$tracked HEAD
          Expand-Archive $tracked $stage -Force

          foreach ($relative in @(
            'files','overlay','replacement','patches',
            'tools\repair_novelty01_premerge.py',
            'tools\apply_novelty01_69_3_complete.py',
            'tools\apply_novelty01_69_4_complete.py',
            'tools\apply_novelty01_complete.py',
            'tools\apply_novelty01_sgapt.py',
            'tools\verify_novelty01_sgapt.py',
            'tools\final_stage\apply_formal_asset_binding_patch.py',
            '.github\workflows\build-main-baseline-p-only-package.yml',
            '.github\workflows\build-main-baseline-p-only-package-pr.yml')) {
            $path = Join-Path $stage $relative
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }
          Get-ChildItem $stage -Filter 'TEMP_PR_TRIGGER*.md' -File -ErrorAction SilentlyContinue |
            Remove-Item -Force

          Get-ChildItem $stage -Recurse -Filter '*.vcxproj.user' | ForEach-Object {
            $text = Get-Content $_.FullName -Raw
            $text = $text.Replace(
              '--local-capture --local-capture-warmup 10 --local-capture-frames 120 --local-capture-method DEV',
              '--local-capture --local-capture-warmup 120 --local-capture-frames 1800')
            $text = $text -replace '(?m)^\s*<DebuggerFlavor>WindowsLocalDebugger</DebuggerFlavor>\r?\n?', ''
            [IO.File]::WriteAllText($_.FullName, $text, [Text.UTF8Encoding]::new($false))
          }

          @'
          # Main baseline + P-only integration

          - Main baseline: 8bf5c77bc7826575cecfa1943f842642d1538a6c
          - Novelty01 merged source: 31712688d8d5ce2e3a91d4fc01e1e29bb5c08f5a
          - B0-B8 use the Main/legacy path.
          - Only P uses SG-APT.
          - Visual Studio local capture is restored to warm-up 120 / measurement 1800.
          - Main-side latest_run.json is retained.
          - Duplicate package trees are removed.

          Rebuild once, then measure B0 and P with the same executable.
          '@ | Set-Content (Join-Path $stage 'MAIN_BASELINE_P_ONLY_README.md') -Encoding UTF8

          [ordered]@{
            schema = 'hairsystem-main-baseline-p-only-v1'
            mainBaselineCommit = '8bf5c77bc7826575cecfa1943f842642d1538a6c'
            noveltySourceCommit = '31712688d8d5ce2e3a91d4fc01e1e29bb5c08f5a'
            baselineMethods = @('B0','B1','B2','B3','B4','B5','B6','B7','B8')
            noveltyMethods = @('P')
            warmupFrames = 120
            measurementFrames = 1800
            comparisonRule = 'Measure B0 and P with the same rebuilt executable.'
          } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $stage 'MAIN_BASELINE_P_ONLY_POLICY.json') -Encoding UTF8
          "STAGE=$stage" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "OUT=$out" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate conditions and contract tests
        shell: pwsh
        run: |
          Set-Location $env:STAGE
          foreach ($forbidden in @('files','overlay','replacement','patches')) {
            if (Test-Path $forbidden) { throw "Forbidden tree remains: $forbidden" }
          }
          if (Get-ChildItem . -Filter 'TEMP_PR_TRIGGER*.md' -File -ErrorAction SilentlyContinue) {
            throw 'Temporary trigger file remains.'
          }
          foreach ($file in Get-ChildItem -Recurse -Filter '*.vcxproj.user') {
            $text = Get-Content $file.FullName -Raw
            if (-not $text.Contains('--local-capture-warmup 120 --local-capture-frames 1800')) { throw 'Main capture conditions not restored.' }
            if ($text.Contains('--local-capture-method DEV')) { throw 'DEV method remains.' }
          }
          python -m unittest discover -s tests/final_stage -p 'test_b0_readiness_smoke.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/final_stage -p 'test_viewer_foundation_single_owner.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/final_stage -p 'test_novelty01_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Release x64 build
        shell: pwsh
        run: |
          Set-Location $env:STAGE
          New-Item -ItemType Directory -Force validation_logs | Out-Null
          msbuild HairSystem.sln /m /t:Rebuild /nologo /verbosity:minimal /p:Configuration=Release /p:Platform=x64 /p:HairGpuStep0ProfileEnabled=false /p:HairGpuFormalBuild=true /fl "/flp:logfile=validation_logs\release_x64_build.log;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native and shader self-tests
        shell: pwsh
        run: |
          Set-Location $env:STAGE
          & .\bin\Release\HairSystem\HairSystem.exe --native-self-test 2>&1 | Tee-Object validation_logs\native_self_test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\bin\Release\HairSystem\HairSystem.exe --shader-self-test 2>&1 | Tee-Object validation_logs\shader_self_test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package full source
        shell: pwsh
        run: |
          Set-Location $env:STAGE
          foreach ($dir in @('bin','bin-int','obj','obj-int','.vs')) {
            if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          }
          $root = (Get-Location).Path
          $entries = Get-ChildItem -Recurse -File | Sort-Object FullName | ForEach-Object {
            [ordered]@{
              path = $_.FullName.Substring($root.Length + 1).Replace('\','/')
              sizeBytes = $_.Length
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          [ordered]@{
            schema = 'hairsystem-main-baseline-p-only-manifest-v1'
            sourceCommit = '31712688d8d5ce2e3a91d4fc01e1e29bb5c08f5a'
            mainBaselineCommit = '8bf5c77bc7826575cecfa1943f842642d1538a6c'
            fileCount = @($entries).Count
            files = @($entries)
          } | ConvertTo-Json -Depth 8 | Set-Content SOURCE_MANIFEST.json -Encoding UTF8
          $zip = Join-Path $env:OUT 'HairSystem_Novelty01_MainBaseline_POnly_FullSource.zip'
          Compress-Archive -Path (Join-Path $env:STAGE '*') -DestinationPath $zip -CompressionLevel Optimal -Force
          "PACKAGE_ZIP=$zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: HairSystem-Novelty01-MainBaseline-POnly
          retention-days: 30
          if-no-files-found: error
          path: ${{ env.PACKAGE_ZIP }}
