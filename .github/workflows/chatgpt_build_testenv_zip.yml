            }

            m_experimentCase.formalAssetPath = formalAssetPathText;
            m_experimentCase.formalAssetSha256 = GetEnvironmentVariableString(L"HAIRGPU_FORMAL_ASSET_SHA256");
            m_experimentCase.formalTopologySha256 = GetEnvironmentVariableString(L"HAIRGPU_FORMAL_TOPOLOGY_SHA256");
            m_experimentCase.generatorSettingsSha256 = GetEnvironmentVariableString(L"HAIRGPU_GENERATOR_SETTINGS_SHA256");

            const std::filesystem::path formalAssetPath(formalAssetPathText);
            hairgpu::HairAsset formalAsset = {};
            std::string formalAssetError;
            if (!std::filesystem::is_regular_file(formalAssetPath) ||
                !hairgpu::LoadHairAssetFromHairBinary(formalAssetPath, formalAsset, formalAssetError))
            {
                const std::wstring details = L"Failed to load the frozen formal asset: " + formalAssetPath.wstring() +
                    L"\r\n" + Utf8ToWide(formalAssetError);
                ShowStartupDialog(nullptr, L"Hair GPU Viewer Formal Asset Failure", details);
                return false;
            }

            const uint64_t expectedFormalStrands =
                static_cast<uint64_t>(kFixedGuideCount) *
                static_cast<uint64_t>(kFixedFollowersPerGuide + 1u);
            const uint64_t expectedFormalPoints =
                expectedFormalStrands * static_cast<uint64_t>(kFixedParticlesPerStrand);
            const bool formalShapeValid =
                formalAsset.guideStrandCount == kFixedGuideCount &&
                formalAsset.followerStrandCount == kFixedGuideCount * kFixedFollowersPerGuide &&
                formalAsset.particlesPerStrand == kFixedParticlesPerStrand &&
                formalAsset.strands.size() == expectedFormalStrands &&
                formalAsset.restPoints.size() == expectedFormalPoints &&
                formalAsset.pointWidths.size() == expectedFormalPoints &&
                formalAsset.rootBindings.size() == expectedFormalStrands &&
                formalAsset.followData.size() == expectedFormalStrands;
            if (!formalShapeValid)
            {
                ShowStartupDialog(nullptr, L"Hair GPU Viewer Formal Asset Failure",
                    L"The frozen asset does not satisfy 4000 guides / 24 followers / 128 points / 100000 displayed strands.");
                return false;
            }

            std::error_code canonicalError;
            const std::filesystem::path observedPath = std::filesystem::weakly_canonical(formalAssetPath, canonicalError);
            m_asset = std::move(formalAsset);
            m_experimentCase.observedAssetPath = canonicalError ? formalAssetPath.wstring() : observedPath.wstring();
            m_experimentCase.formalAssetLoaded = true;
            m_lastAssetSource = L"Frozen Formal Asset";
            m_lastImportStatus = L"Frozen formal asset loaded and topology-count validated";
        }
        else
        {
'''
          insert_before_once(
              "apps/dx11_viewer/src/GpuHairViewer_parts/01_window_device_and_ui_setup.inl",
              "        // The formal 100k asset is expensive to procedurally rebuild.",
              formal_asset_block,
          )
          insert_before_once(
              "apps/dx11_viewer/src/GpuHairViewer_parts/01_window_device_and_ui_setup.inl",
              "        m_activeSetBudget.maxActiveClusters = 6u;",
              "        }\n",
          )

          # 7. Shader self-test exits immediately after the existing full shader load succeeds.
          insert_before_once(
              "apps/dx11_viewer/src/GpuHairViewer_parts/02_resource_creation_and_shader_loading.inl",
              "        RebuildActiveSetFoundation();",
              '''        if (EnvironmentValueIsTrue(GetEnvironmentVariableString(L"HAIRGPU_SHADER_SELF_TEST")))
        {
            m_running = false;
            return true;
        }

''',
          )

          # 8. Persist requested and observed formal-asset identity.
          insert_after_once(
              "apps/dx11_viewer/src/GpuHairViewer_parts/11_experiment_env_and_performance_sample.inl",
              '        out << "  \\"assetSha256\\": \\"" << JsonEscape(WideToUtf8(m_experimentCase.assetSha256)) << "\\",\\n";\n',
              '''        out << "  \\"formalAssetPath\\": \\"" << JsonEscape(WideToUtf8(m_experimentCase.formalAssetPath)) << "\\",\\n";
        out << "  \\"observedAssetPath\\": \\"" << JsonEscape(WideToUtf8(m_experimentCase.observedAssetPath)) << "\\",\\n";
        out << "  \\"formalAssetSha256\\": \\"" << JsonEscape(WideToUtf8(m_experimentCase.formalAssetSha256)) << "\\",\\n";
        out << "  \\"formalTopologySha256\\": \\"" << JsonEscape(WideToUtf8(m_experimentCase.formalTopologySha256)) << "\\",\\n";
        out << "  \\"generatorSettingsSha256\\": \\"" << JsonEscape(WideToUtf8(m_experimentCase.generatorSettingsSha256)) << "\\",\\n";
        out << "  \\"formalAssetLoaded\\": " << (m_experimentCase.formalAssetLoaded ? "true" : "false") << ",\\n";
''',
          )
          replace_once(
              "apps/dx11_viewer/src/GpuHairViewer_parts/11_experiment_env_and_performance_sample.inl",
              "            m_experimentCase.assetFrozen &&\n",
              "            m_experimentCase.assetFrozen &&\n"
              "            m_experimentCase.formalAssetLoaded &&\n"
              "            !m_experimentCase.formalAssetPath.empty() &&\n"
              "            !m_experimentCase.observedAssetPath.empty() &&\n",
          )

          # 9. Native self-test uses the actual compiled ABI and fixed-workload constants.
          tail_path = "apps/dx11_viewer/src/GpuHairViewer_parts/15_shutdown_and_tail.inl"
          tail = read(tail_path)
          close_index = tail.rfind("\n}")
          if close_index < 0:
              raise RuntimeError("Could not locate viewer namespace close")
          native_test = r'''

    int GpuHairViewer::RunNativeSelfTests() const
    {
        if (sizeof(void*) != 8u) return 10;
        if (kFixedGuideCount != 4000u || kFixedFollowersPerGuide != 24u ||
            kFixedDisplayStrandCount != 100000u || kFixedParticlesPerStrand != 128u ||
            kFixedSolverIterations != 6u) return 11;
        if (kFixedGuideCount * (kFixedFollowersPerGuide + 1u) != kFixedDisplayStrandCount) return 12;
        if ((sizeof(SegmentGroupGpuData) % 16u) != 0u ||
            (sizeof(SegmentGroupBlockGpuData) % 16u) != 0u ||
            (sizeof(SegmentGroupCertificateGpuData) % 16u) != 0u ||
            (sizeof(SegmentGroupRuntimeCounters) % 16u) != 0u ||
            (sizeof(SegmentGroupRuntimeConstants) % 16u) != 0u) return 13;
        return 0;
    }
'''
          tail = tail[:close_index] + native_test + tail[close_index:]
          write(tail_path, tail)

          # 10. Replace the freeze tool with a non-destructive template -> output workflow.
          write(
              "tools/final_stage/freeze_novelty01_asset.py",
              '''from __future__ import annotations

import argparse
import hashlib
import json
import re
import subprocess
import tempfile
from datetime import datetime, timezone
from pathlib import Path
from typing import Any

SHA256_PATTERN = re.compile(r"^[0-9a-fA-F]{64}$")
COMMIT_PATTERN = re.compile(r"^[0-9a-fA-F]{40}$")
MANIFEST_VERSION = "novelty01-100k-v1.4"


def read_json(path: Path) -> dict[str, Any]:
    value = json.loads(path.read_text(encoding="utf-8-sig"))
    if not isinstance(value, dict):
        raise SystemExit(f"Expected a JSON object: {path}")
    return value


def sha256_file(path: Path) -> str:
    digest = hashlib.sha256()
    with path.open("rb") as handle:
        for chunk in iter(lambda: handle.read(1024 * 1024), b""):
            digest.update(chunk)
    return digest.hexdigest()


def git_value(repo_root: Path, *args: str) -> str:
    try:
        completed = subprocess.run(
            ["git", *args], cwd=repo_root, check=False,
            capture_output=True, text=True, timeout=20,
        )
    except (FileNotFoundError, subprocess.SubprocessError):
        return ""
    return completed.stdout.strip() if completed.returncode == 0 else ""


def find_repo_root(start: Path) -> Path | None:
    for candidate in [start, *start.parents]:
        if (candidate / ".git").exists():
            return candidate
    return None


def atomic_write_json(path: Path, payload: dict[str, Any]) -> None:
    encoded = json.dumps(payload, ensure_ascii=False, indent=2, allow_nan=False) + "\\n"
    path.parent.mkdir(parents=True, exist_ok=True)
    with tempfile.NamedTemporaryFile("w", encoding="utf-8", dir=path.parent, delete=False) as handle:
        handle.write(encoded)
        temporary = Path(handle.name)
    temporary.replace(path)


def main() -> int:
    parser = argparse.ArgumentParser(description="Freeze the real Novelty01 100k asset without mutating the tracked template manifest.")
    parser.add_argument("--template-manifest", "--manifest", dest="template_manifest", required=True)
    parser.add_argument("--output-manifest", required=True)
    parser.add_argument("--asset", required=True)
    parser.add_argument("--generator-settings", required=True)
    topology_group = parser.add_mutually_exclusive_group(required=True)
    topology_group.add_argument("--topology-file")
    topology_group.add_argument("--topology-sha256")
    parser.add_argument("--operator", required=True)
    parser.add_argument("--repo-root")
    parser.add_argument("--allow-dirty-worktree", action="store_true")
    parser.add_argument("--force", action="store_true")
    args = parser.parse_args()

    template_path = Path(args.template_manifest).resolve()
    output_path = Path(args.output_manifest).resolve()
    asset_path = Path(args.asset).resolve()
    settings_path = Path(args.generator_settings).resolve()
    topology_path = Path(args.topology_file).resolve() if args.topology_file else None
    for path, label in ((template_path, "template manifest"), (asset_path, "asset"), (settings_path, "generator settings")):
        if not path.is_file():
            raise SystemExit(f"Missing {label}: {path}")
    if topology_path is not None and not topology_path.is_file():
        raise SystemExit(f"Missing topology file: {topology_path}")
    if output_path.exists() and not args.force:
        raise SystemExit(f"Output manifest already exists: {output_path}. Use --force to replace it intentionally.")

    repo_root = Path(args.repo_root).resolve() if args.repo_root else find_repo_root(template_path.parent)
    if repo_root is None:
        raise SystemExit("Cannot locate the Git repository root.")
    head = git_value(repo_root, "rev-parse", "HEAD")
    branch = git_value(repo_root, "branch", "--show-current")
    dirty = git_value(repo_root, "status", "--porcelain", "--untracked-files=normal")
    if not COMMIT_PATTERN.fullmatch(head):
        raise SystemExit("Cannot resolve a valid Git HEAD commit.")
    if branch != "Novelty":
        raise SystemExit(f"Asset freezing requires branch Novelty, observed: {branch or '<detached>'}")
    if dirty and not args.allow_dirty_worktree:
        raise SystemExit("Git worktree is dirty. Commit changes before freezing formal evidence.")

    topology_sha256 = sha256_file(topology_path) if topology_path else str(args.topology_sha256).lower()
    if not SHA256_PATTERN.fullmatch(topology_sha256):
        raise SystemExit("Topology SHA-256 must be exactly 64 hexadecimal characters.")

    payload = read_json(template_path)
    generation = payload.setdefault("generation", {})
    expected = {
        "displayStrandCount": 100000,
        "primaryGuideStrandCount": 4000,
        "followersPerGuide": 24,
        "particlesPerGuide": 128,
        "solverIterations": 6,
    }
    mismatches = {key: (expected_value, generation.get(key)) for key, expected_value in expected.items() if generation.get(key) != expected_value}
    if mismatches:
        raise SystemExit(f"Template generation contract mismatch: {mismatches}")

    payload.update({
        "manifestVersion": MANIFEST_VERSION,
        "freezeStatus": "FROZEN",
        "sourceAssetPath": str(asset_path),
        "sourceAssetSha256": sha256_file(asset_path),
        "sourceAssetSizeBytes": asset_path.stat().st_size,
        "generatedTopologySha256": topology_sha256,
        "generatorSettingsPath": str(settings_path),
        "generatorSettingsSha256": sha256_file(settings_path),
        "frozenAtUtc": datetime.now(timezone.utc).isoformat(),
        "frozenBy": args.operator,
        "sourceCommitSha": head.lower(),
        "sourceBranch": branch,
        "freezeTool": "tools/final_stage/freeze_novelty01_asset.py",
        "freezeToolVersion": "1.4",
    })
    gate = payload.setdefault("evidenceGate", {})
    gate.update({
        "rejectWhenFreezeStatusIsNot": "FROZEN",
        "rejectPlaceholderHashes": True,
        "requireExactSha256Format": True,
        "requireSameAssetHashAcrossAllMethodsAndSeeds": True,
        "requireSourceCommitMatch": True,
        "requireCleanGitWorktreeAtFreeze": not args.allow_dirty_worktree,
        "requireLocalFileHashVerification": True,
        "requireViewerObservedAssetPathMatch": True,
        "requirePreAndPostRunAssetHashMatch": True,
    })
    atomic_write_json(output_path, payload)
    print(f"Frozen manifest: {output_path}")
    print(f"Asset SHA-256: {payload['sourceAssetSha256']}")
    print(f"Topology SHA-256: {payload['generatedTopologySha256']}")
    print(f"Generator settings SHA-256: {payload['generatorSettingsSha256']}")
    print(f"Source commit: {payload['sourceCommitSha']}")
    return 0


if __name__ == "__main__":
    raise SystemExit(main())
''',
          )

          # 11. Formal runner: frozen-asset contract, quality-failed resume, repeated timelines.
          final_run = "tools/final_stage/hairgpu_final_run.py"
          replace_once(final_run, 'VALIDATION_VERSION = "01-safe-v3.2-existing-source-only"', 'VALIDATION_VERSION = "01-safe-v3.3-existing-source-only"')
          insert_after_once(
              final_run,
