name: Build HairSystem test-environment ZIP

on:
  pull_request:
    branches: [Novelty]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply existing-file-only changes
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import shutil
          import subprocess
          import sys
          import zipfile
          from pathlib import Path

          ROOT = Path.cwd()
          TARGETS = [
              ".gitignore",
              "Directory.Build.targets",
              "HairSystem.vcxproj",
              "apps/dx11_viewer/src/AppMain.cpp",
              "apps/dx11_viewer/src/GpuHairViewer.h",
              "apps/dx11_viewer/src/GpuHairViewer_parts/01_window_device_and_ui_setup.inl",
              "apps/dx11_viewer/src/GpuHairViewer_parts/02_resource_creation_and_shader_loading.inl",
              "apps/dx11_viewer/src/GpuHairViewer_parts/11_experiment_env_and_performance_sample.inl",
              "apps/dx11_viewer/src/GpuHairViewer_parts/15_shutdown_and_tail.inl",
              "tools/final_stage/freeze_novelty01_asset.py",
              "tools/final_stage/hairgpu_final_run.py",
              "tools/final_stage/hairgpu_runtime_suite.py",
              "tools/final_stage/hairgpu_final_db.py",
              "tools/final_stage/Run_Final_Runtime_Suite.bat",
              "tests/final_stage/test_hairgpu_safe_runtime_suite.py",
              "docs/sample_assets/final_runtime_suite_template.json",
              "docs/sample_assets/novelty01_100k_asset_manifest.json",
          ]

          def path_of(relative: str) -> Path:
              path = ROOT / relative
              if not path.is_file():
                  raise RuntimeError(f"Missing existing target: {relative}")
              return path

          def read(relative: str) -> str:
              return path_of(relative).read_text(encoding="utf-8-sig")

          def write(relative: str, text: str) -> None:
              path_of(relative).write_text(text, encoding="utf-8", newline="\n")

          def replace_once(relative: str, old: str, new: str) -> None:
              text = read(relative)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{relative}: expected one occurrence, found {count}: {old[:80]!r}")
              write(relative, text.replace(old, new, 1))

          def insert_before_once(relative: str, marker: str, addition: str) -> None:
              replace_once(relative, marker, addition + marker)

          def insert_after_once(relative: str, marker: str, addition: str) -> None:
              replace_once(relative, marker, marker + addition)

          # 1. .gitignore: remove unresolved merge markers and preserve all result patterns.
          gitignore = read(".gitignore")
          gitignore = "\n".join(
              line for line in gitignore.splitlines()
              if not re.match(r"^(<<<<<<<|=======|>>>>>>>)", line)
          ) + "\n"
          for pattern in (
              "*_settings.json", "*_environment.json", "*_validation.json",
              "*_manifest.json", "*_hardware_timeseries.csv",
          ):
              if pattern not in gitignore.splitlines():
                  gitignore += pattern + "\n"
          write(".gitignore", gitignore)

          # 2. Disable Step0 by default and completely suppress it for formal builds.
          replace_once(
              "Directory.Build.targets",
              '<HairGpuStep0ProfileEnabled Condition="\'$(HairGpuStep0ProfileEnabled)\' == \'\'">true</HairGpuStep0ProfileEnabled>',
              '<HairGpuStep0ProfileEnabled Condition="\'$(HairGpuStep0ProfileEnabled)\' == \'\'">false</HairGpuStep0ProfileEnabled>\n'
              '    <HairGpuFormalBuild Condition="\'$(HairGpuFormalBuild)\' == \'\'">false</HairGpuFormalBuild>\n'
              '    <HairGpuFormalSelfTest Condition="\'$(HairGpuFormalSelfTest)\' == \'\'">false</HairGpuFormalSelfTest>',
          )
          replace_once(
              "Directory.Build.targets",
              "Condition=\"'$(HairGpuStep0ProfileEnabled)' == 'true' and '$(TargetPath)' != ''\"",
              "Condition=\"'$(HairGpuStep0ProfileEnabled)' == 'true' and '$(HairGpuFormalBuild)' != 'true' and '$(TargetPath)' != ''\"",
          )

          # 3. Connect native and shader self-tests to the existing project.
          insert_before_once(
              "HairSystem.vcxproj",
              '  <Import Project="$(VCTargetsPath)\\Microsoft.Cpp.targets" />',
              '''  <Target Name="HairGpuFormalSelfTests" AfterTargets="Build" Condition="'$(HairGpuFormalSelfTest)' == 'true'">
    <Exec Command="&quot;$(TargetPath)&quot; --native-self-test" />
    <Exec Command="&quot;$(TargetPath)&quot; --shader-self-test" />
  </Target>
''',
          )

          # 4. Existing AppMain becomes the command-line entry for built-in tests.
          write(
              "apps/dx11_viewer/src/AppMain.cpp",
              '''#include "GpuHairViewer.h"

#include <windows.h>
#include <cwchar>
#include <filesystem>

int WINAPI wWinMain(HINSTANCE instance, HINSTANCE, PWSTR, int showCommand)
{
    wchar_t modulePath[MAX_PATH] = {};
    GetModuleFileNameW(nullptr, modulePath, MAX_PATH);
    const std::filesystem::path exeDir = std::filesystem::path(modulePath).parent_path();
    SetCurrentDirectoryW(exeDir.c_str());

    const wchar_t* commandLine = GetCommandLineW();
    if (std::wcsstr(commandLine, L"--native-self-test") != nullptr)
    {
        hairgpu::viewer::GpuHairViewer app;
        return app.RunNativeSelfTests();
    }
    if (std::wcsstr(commandLine, L"--shader-self-test") != nullptr)
    {
        SetEnvironmentVariableW(L"HAIRGPU_SHADER_SELF_TEST", L"1");
        hairgpu::viewer::GpuHairViewer app;
        return app.Initialize(instance, SW_HIDE) ? 0 : 2;
    }

    hairgpu::viewer::GpuHairViewer app;
    if (!app.Initialize(instance, showCommand))
    {
        MessageBoxW(nullptr,
            L"GpuHairViewer::Initialize returned false.\r\n\r\nStartup failed before the normal viewer loop began.\r\nA startup diagnostic dialog should already have been shown.",
            L"Hair GPU Viewer Startup Failure",
            MB_OK | MB_ICONERROR);
        return 1;
    }

    return app.Run();
}
''',
          )

          # 5. Add formal-asset identity and the native-test entry to the existing class.
          insert_after_once(
              "apps/dx11_viewer/src/GpuHairViewer.h",
              "        int Run();\n",
              "        int RunNativeSelfTests() const;\n",
          )
          insert_after_once(
              "apps/dx11_viewer/src/GpuHairViewer.h",
              "            std::wstring assetManifestPath;\n",
              '''            std::wstring formalAssetPath;
            std::wstring formalAssetSha256;
            std::wstring formalTopologySha256;
            std::wstring generatorSettingsSha256;
            std::wstring observedAssetPath;
            bool formalAssetLoaded = false;
''',
          )

          # 6. Formal runs must load the exact frozen asset; interactive mode retains the old cache path.
          formal_asset_block = r'''        // HAIRGPU_FORMAL_ASSET_BINDING_V1: a formal run may never fall back to a generated/cache asset.
        if (m_experimentCase.enabled)
        {
            const std::wstring formalAssetPathText = GetEnvironmentVariableString(L"HAIRGPU_FORMAL_ASSET_PATH");
            if (formalAssetPathText.empty())
            {
                ShowStartupDialog(nullptr, L"Hair GPU Viewer Formal Asset Failure",
