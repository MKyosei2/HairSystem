          write(manifest_path, json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")

          # Static validation before packaging.
          for relative in TARGETS:
              p = path_of(relative)
              if p.stat().st_size == 0:
                  raise RuntimeError(f"Zero-byte target: {relative}")
              for number, line in enumerate(p.read_text(encoding="utf-8-sig", errors="replace").splitlines(), 1):
                  if re.match(r"^(<<<<<<<|=======|>>>>>>>)", line):
                      raise RuntimeError(f"Conflict marker remains: {relative}:{number}")

          for relative in (
              "tools/final_stage/freeze_novelty01_asset.py",
              "tools/final_stage/hairgpu_final_run.py",
              "tools/final_stage/hairgpu_runtime_suite.py",
              "tools/final_stage/hairgpu_final_db.py",
              "tests/final_stage/test_hairgpu_safe_runtime_suite.py",
          ):
              subprocess.run([sys.executable, "-m", "py_compile", str(ROOT / relative)], check=True)

          json.loads(read("docs/sample_assets/final_runtime_suite_template.json"))
          json.loads(read("docs/sample_assets/novelty01_100k_asset_manifest.json"))

          # Preserve only the requested existing paths in the final ZIP.
          package_root = ROOT / "_package" / "HairSystem_Novelty_TestEnvironment_Completed_20260718"
          if package_root.parent.exists():
              shutil.rmtree(package_root.parent)
          for relative in TARGETS:
              destination = package_root / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(ROOT / relative, destination)

          zip_path = ROOT / "HairSystem_Novelty_TestEnvironment_Completed_20260718.zip"
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for file in sorted(package_root.rglob("*")):
                  if file.is_file():
                      archive.write(file, file.relative_to(package_root.parent).as_posix())

          with zipfile.ZipFile(zip_path) as archive:
              names = [name for name in archive.namelist() if not name.endswith("/")]
              if len(names) != len(TARGETS):
                  raise RuntimeError(f"ZIP member count mismatch: {len(names)} != {len(TARGETS)}")
          print(zip_path)
          PY

      - name: Run Python regression tests
        shell: bash
        run: |
          python -m unittest discover -s tests/final_stage -p 'test_*.py'

      - name: Upload completed ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HairSystem_Novelty_TestEnvironment_Completed_20260718
          path: HairSystem_Novelty_TestEnvironment_Completed_20260718.zip
          if-no-files-found: error
          retention-days: 7
