name: Novelty01 Formal Source Gate

on:
  push:
    branches:
      - Novelty01
  pull_request:
    paths:
      - '.github/workflows/novelty01-formal-gate.yml'
      - 'apps/dx11_viewer/**'
      - 'include/hairgpu/**'
      - 'tools/final_stage/**'
      - 'tests/final_stage/**'
      - 'benchmarks/novelty01/**'
      - 'docs/experiments/NOVELTY01_*'
      - 'docs/sample_assets/novelty01_frozen_parameters.json'
      - '設計書/01_TopNovelty_NewStrandDataType.md'
      - 'HairSystem.vcxproj'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novelty01-formal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build-shader-gate:
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
      HAIRGPU_N01_FORMAL_TELEMETRY: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Locate FXC
        shell: pwsh
        run: |
          $candidates = Get-ChildItem `
            'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\fxc.exe' `
            -ErrorAction SilentlyContinue | Sort-Object FullName -Descending
          if (-not $candidates) {
            throw 'fxc.exe was not found in the Windows SDK.'
          }
          $fxc = $candidates[0].FullName
          "FXC=$fxc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Split-Path $fxc | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Create evidence directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts | Out-Null

      - name: Validate Python and contract tests
        shell: pwsh
        run: |
          python -m py_compile tools/final_stage/hairgpu_novelty01_preflight.py
          python -m py_compile tools/final_stage/hairgpu_novelty01_readiness_smoke.py
          python -m py_compile tools/final_stage/hairgpu_novelty01_matrix.py
          python -m py_compile tools/final_stage/hairgpu_final_run.py
          python tools/final_stage/hairgpu_final_run.py --self-test
          python -m unittest discover -s tests/final_stage -p 'test_novelty01_*.py' -v

      - name: Validate C++ header and all Novelty01 shaders
        shell: pwsh
        run: |
          python tools/final_stage/hairgpu_novelty01_preflight.py `
            --repo . `
            --require-fxc `
            --require-clean-git `
            --json artifacts/novelty01_preflight.json

      - name: Release x64 formal rebuild
        shell: pwsh
        run: |
          msbuild HairSystem.sln `
            /m `
            /t:Rebuild `
            /nologo `
            /verbosity:minimal `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:HairGpuStep0ProfileEnabled=false `
            /p:HairGpuFormalBuild=true `
            /fl `
            "/flp:logfile=artifacts/release_x64_build.log;verbosity=normal"

      - name: Native self-test
        shell: pwsh
        run: |
          & .\bin\Release\HairSystem\HairSystem.exe --native-self-test 2>&1 |
            Tee-Object -FilePath artifacts/native_self_test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Baseline shader self-test
        shell: pwsh
        run: |
          & .\bin\Release\HairSystem\HairSystem.exe --shader-self-test 2>&1 |
            Tee-Object -FilePath artifacts/shader_self_test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify clean tracked source
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tracked = @(git status --porcelain --untracked-files=no)
          if ($tracked.Count -gt 0) {
            $tracked | ForEach-Object { Write-Host $_ }
            throw 'Tracked source changed during formal gate.'
          }

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novelty01-source-gate-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/novelty01_preflight.json
            artifacts/release_x64_build.log
            artifacts/native_self_test.log
            artifacts/shader_self_test.log
