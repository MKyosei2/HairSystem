      - name: Package complete modified existing files
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'HairSystem_70_27_SoakStability_existing_files_only'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $files = @(
            'tools/final_stage/Run_Thesis_B0_P_Formal.ps1',
            'tools/final_stage/hairgpu_final_run.py',
            'tests/final_stage/test_thesis_formal_experiment_contract.py'
          )
          foreach ($relative in $files) {
            $destination = Join-Path $stage $relative
            New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
            Copy-Item -LiteralPath $relative -Destination $destination -Force
          }
          $zip = Join-Path $env:RUNNER_TEMP 'HairSystem_70_27_SoakStability_existing_files_only.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "ZIP_SHA256=$hash"
          "ZIP_SHA256=$hash" | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'zip_sha256.txt') -Encoding ASCII

      - uses: actions/upload-artifact@v4
        with:
          name: HairSystem_70_27_SoakStability_existing_files_only
          path: |
            ${{ runner.temp }}/HairSystem_70_27_SoakStability_existing_files_only.zip
            ${{ runner.temp }}/zip_sha256.txt
          if-no-files-found: error
          retention-days: 7
