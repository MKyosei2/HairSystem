name: Temporary build 70.27 soak stability patch

on:
  push:
    branches:
      - integration/novelty01-safe-soak-7027

permissions:
  contents: write

jobs:
  patch_test_package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: integration/novelty01-safe-soak-7027
          fetch-depth: 0

      - name: Apply existing-file patch
        shell: pwsh
        run: |
          python tools/final_stage/_temporary_patch_7027.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/final_stage/_temporary_test_expectation_7027.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Python syntax
        shell: pwsh
        run: |
          python -m py_compile tools/final_stage/hairgpu_final_run.py
          python -m py_compile tests/final_stage/test_thesis_formal_experiment_contract.py

      - name: Formal runner parser
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/final_stage/Run_Thesis_B0_P_Formal.ps1'), [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) {
            $errors | Format-List | Out-String | Write-Host
            throw 'Formal runner contains PowerShell syntax errors.'
          }

      - name: Final-run self-test
        shell: pwsh
        run: python tools/final_stage/hairgpu_final_run.py --self-test

      - name: Thesis contract regression
        shell: pwsh
        run: python -m unittest discover -s tests/final_stage -p "test_thesis_formal_experiment_contract.py" -v

      - name: Performance readback regression
        shell: pwsh
        run: python -m unittest discover -s tests/final_stage -p "test_novelty01_performance_readback_stability.py" -v

      - name: Commit only modified existing source files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temporary_build_soak_fix_7027.yml
          git rm tools/final_stage/_temporary_patch_7027.py
          git rm tools/final_stage/_temporary_test_expectation_7027.py
          git add tools/final_stage/Run_Thesis_B0_P_Formal.ps1
          git add tools/final_stage/hairgpu_final_run.py
          git add tests/final_stage/test_thesis_formal_experiment_contract.py
          git status --short
          git commit -m "70.27"
          git push origin HEAD:integration/novelty01-safe-soak-7027

      - name: Package complete modified existing files
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'HairSystem_70_27_SoakStability_existing_files_only'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $files = @('tools/final_stage/Run_Thesis_B0_P_Formal.ps1','tools/final_stage/hairgpu_final_run.py','tests/final_stage/test_thesis_formal_experiment_contract.py')
          foreach ($relative in $files) {
            $destination = Join-Path $stage $relative
            New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
            Copy-Item -LiteralPath $relative -Destination $destination -Force
          }
          $zip = Join-Path $env:RUNNER_TEMP 'HairSystem_70_27_SoakStability_existing_files_only.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "ZIP_SHA256=$hash" | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'zip_sha256.txt') -Encoding ASCII
          Write-Host "ZIP_SHA256=$hash"

      - name: Upload patch bundle
        uses: actions/upload-artifact@v4
        with:
          name: HairSystem_70_27_SoakStability_existing_files_only
          path: |
            ${{ runner.temp }}/HairSystem_70_27_SoakStability_existing_files_only.zip
            ${{ runner.temp }}/zip_sha256.txt
          if-no-files-found: error
          retention-days: 7
