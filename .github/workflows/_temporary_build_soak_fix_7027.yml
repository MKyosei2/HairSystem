      - name: Preserve only existing-file source changes and commit 70.27
        shell: pwsh
        run: |
          Remove-Item -LiteralPath patch_7027.py -Force -ErrorAction SilentlyContinue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
