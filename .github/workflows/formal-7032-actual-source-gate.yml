name: Formal 70.32 Actual Source Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-7032-actual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gate:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONHASHSEED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax for actual 70.32
        shell: pwsh
        run: |
          $targets = @(
            'tools/final_stage/hairgpu_novelty01_matrix_7032.py',
            'tools/final_stage/hairgpu_thesis_report_7032.py',
            'tools/final_stage/hairgpu_thesis_final_gate_7032.py',
            'tests/final_stage/test_thesis_formal_experiment_contract_7032.py'
          )
          foreach ($target in $targets) {
            python -m py_compile $target
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: 70.32 shutdown-race contract regression tests
        shell: pwsh
        run: |
          python -m unittest discover `
            -s tests/final_stage `
            -p test_thesis_formal_experiment_contract_7032.py `
            -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows PowerShell 5.1 parser check
        shell: powershell
        run: |
          $targets = @(
            'tools/final_stage/Run_Thesis_B0_P_Formal_7032.ps1',
            'tools/final_stage/Run_Thesis_B0_P_Formal_7032_FIXED.ps1'
          )
          foreach ($target in $targets) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $target),
              [ref]$tokens,
              [ref]$errors
            )
            if (@($errors).Count -ne 0) {
              $errors | Format-List | Out-String | Write-Host
              throw "PowerShell 5.1 parser check failed: $target"
            }
          }
          Write-Host 'Formal 70.32 PowerShell 5.1 parser check: PASS'

      - name: Formal 70.32 transformed runtime validation
        shell: powershell
        run: |
          & powershell.exe `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File tools\final_stage\Run_Thesis_B0_P_Formal_7032_FIXED.ps1 `
            -Repo $PWD.Path `
            -OutputRoot (Join-Path $env:RUNNER_TEMP 'HairSystem7032ActualValidation') `
            -ValidateOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Guard and contract invariants
        shell: pwsh
        run: |
          $source = Get-Content tools/final_stage/hairgpu_novelty01_matrix_7032.py -Raw
          foreach ($required in @(
            'NORMAL_SHUTDOWN_WINDOW_GRACE_SECONDS = 2.0',
            'window-lost-before-process-exit',
            'client-area-changed',
            'primary-display-changed',
            'fixed-client-window-guard-v2'
          )) {
            if (-not $source.Contains($required)) {
              throw "70.32 guard invariant missing: $required"
            }
          }

          $contract = Get-Content docs/experiments/NOVELTY01_FORMAL_CONTRACT_7032.json -Raw | ConvertFrom-Json
          if ([int]$contract.comparisonDesign.runBudget.formalTotalRuns -ne 90) {
            throw '70.32 formal run budget is not exactly 90.'
          }
          if ([int]$contract.comparisonDesign.runBudget.expectedRunsPerMethod -ne 45) {
            throw '70.32 per-method run budget is not exactly 45.'
          }
          if ([string]$contract.formalWindowGuard.revision -ne 'fixed-client-window-guard-v2') {
            throw '70.32 guard revision mismatch.'
          }
          if ([double]$contract.formalWindowGuard.normalShutdownWindowGraceSeconds -ne 2.0) {
            throw '70.32 shutdown grace mismatch.'
          }
          if ($contract.formalWindowGuard.autoRecoverAfterActualResize -ne $false) {
            throw '70.32 must not auto-recover an actual resize.'
          }
          if ($contract.formalWindowGuard.viewerExit92RemainsFatal -ne $true) {
            throw '70.32 must preserve native Viewer ExitCode 92 as fatal.'
          }
          if ($contract.formalWindowGuard.guardFailureAfterNativeSuccessIsFatal -ne $true) {
            throw '70.32 guard failure after native success must remain fatal.'
          }
          if ([int]$contract.formalWindowGuard.guardFailureExitCode -ne 96) {
            throw '70.32 guard failure exit code must remain 96.'
          }

      - name: Verify no tracked source mutation
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tracked = @(git status --porcelain --untracked-files=no)
          if ($tracked.Count -gt 0) {
            $tracked | ForEach-Object { Write-Host $_ }
            throw 'Tracked source changed during Formal 70.32 source gate.'
          }
