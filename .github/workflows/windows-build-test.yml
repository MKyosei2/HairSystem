name: Windows Build and Test

on:
  push:
    branches:
      - main
      - Novelty01
  pull_request:
  workflow_dispatch:
    inputs:
      run_formal_smoke:
        description: Run the P/S01 100k readiness smoke on the self-hosted GPU runner
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build-test:
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      PYTHONUTF8: "1"
      PYTHONHASHSEED: "0"
      HAIRGPU_N01_FORMAL_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Locate FXC
        shell: pwsh
        run: |
          $candidates = Get-ChildItem `
            'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\fxc.exe' `
            -ErrorAction SilentlyContinue | Sort-Object FullName -Descending
          if (-not $candidates) {
            throw 'fxc.exe was not found in the Windows SDK.'
          }
          $fxc = $candidates[0].FullName
          "FXC=$fxc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Split-Path $fxc | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using FXC: $fxc"

      - name: Python syntax
        shell: pwsh
        run: |
          $targets = @(
            'tools/final_stage/hairgpu_novelty01_matrix.py',
            'tools/final_stage/hairgpu_novelty01_matrix_7030.py',
            'tools/final_stage/hairgpu_novelty01_readiness_smoke.py',
            'tools/final_stage/hairgpu_novelty01_preflight.py',
            'tools/final_stage/hairgpu_final_run.py',
            'tools/final_stage/hairgpu_thesis_report_7030.py',
            'tools/final_stage/hairgpu_thesis_final_gate_7030.py',
            'tests/final_stage/test_novelty01_complete_contract.py',
            'tests/final_stage/test_novelty01_runtime_contract.py',
            'tests/final_stage/test_novelty01_formal_asset_binding_contract.py',
            'tests/final_stage/test_post_sign_execution_readiness_7029.py',
            'tests/final_stage/test_thesis_formal_experiment_contract_7030.py'
          )
          foreach ($target in $targets) {
            python -m py_compile $target
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Direct formal runner self-test
        shell: pwsh
        run: python tools/final_stage/hairgpu_final_run.py --self-test

      - name: 70.29 signing script parser check
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/signing/Sign-HairSystemBuild.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if (@($errors).Count -ne 0) {
            $errors | Format-List | Out-String | Write-Host
            throw 'Sign-HairSystemBuild.ps1 parser check failed.'
          }

      - name: 70.30 formal runner parser check
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/final_stage/Run_Thesis_B0_P_Formal_7030.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if (@($errors).Count -ne 0) {
            $errors | Format-List | Out-String | Write-Host
            throw 'Run_Thesis_B0_P_Formal_7030.ps1 parser check failed.'
          }

      - name: 70.30 PowerShell 5.1 empty replacement runtime check
        shell: powershell
        run: |
          $path = Resolve-Path 'tools/final_stage/Run_Thesis_B0_P_Formal_7030.ps1'
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            $path,
            [ref]$tokens,
            [ref]$errors
          )
          if (@($errors).Count -ne 0) {
            throw '70.30 runner could not be parsed for runtime binding check.'
          }
          $functionAst = $ast.Find(
            {
              param($node)
              $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Replace-RegexOnce'
            },
            $true
          )
          if ($null -eq $functionAst) {
            throw 'Replace-RegexOnce was not found in 70.30 runner.'
          }
          $probe = @"
          $($functionAst.Extent.Text)
          `$observed = Replace-RegexOnce -Text 'abc' -Pattern 'b' -Replacement '' -Label 'ci-empty-replacement'
          if (`$observed -ne 'ac') { throw "Unexpected empty replacement result: `$observed" }
          Write-Host '70.30 PowerShell 5.1 empty replacement: PASS'
          "@
          $probeBlock = [ScriptBlock]::Create($probe)
          & $probeBlock

      - name: 70.30 full runtime source transformation check
        shell: powershell
        run: |
          & powershell.exe `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File tools\final_stage\Run_Thesis_B0_P_Formal_7030.ps1 `
            -Stage Prepare `
            -Repo $PWD.Path `
            -OutputRoot (Join-Path $env:RUNNER_TEMP 'HairSystem7030TransformValidation') `
            -ValidateTransformOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Novelty01 contract tests
        shell: pwsh
        run: |
          $patterns = @(
            'test_novelty01_complete_contract.py',
            'test_novelty01_runtime_contract.py',
            'test_novelty01_formal_asset_binding_contract.py',
            'test_prenovelty_test_environment_contract.py',
            'test_post_sign_execution_readiness_7029.py',
            'test_thesis_formal_experiment_contract_7030.py'
          )
          foreach ($pattern in $patterns) {
            python -m unittest discover -s tests/final_stage -p $pattern -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Strict source and shader preflight
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python tools/final_stage/hairgpu_novelty01_preflight.py `
            --repo . `
            --require-fxc `
            --require-clean-git `
            --json artifacts/novelty01_preflight.json

      - name: Release x64 formal rebuild
        shell: pwsh
        run: |
          msbuild HairSystem.sln `
            /m `
            /t:Rebuild `
            /nologo `
            /verbosity:minimal `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:HairGpuStep0ProfileEnabled=false `
            /p:HairGpuFormalBuild=true `
            /fl `
            "/flp:logfile=artifacts/release_x64_build.log;verbosity=normal"

      - name: Native self-test
        shell: pwsh
        run: |
          & .\bin\Release\HairSystem\HairSystem.exe --native-self-test 2>&1 |
            Tee-Object -FilePath artifacts/native_self_test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Baseline shader self-test
        shell: pwsh
        run: |
          & .\bin\Release\HairSystem\HairSystem.exe --shader-self-test 2>&1 |
            Tee-Object -FilePath artifacts/shader_self_test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify tests did not modify tracked source
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tracked = @(git status --porcelain --untracked-files=no)
          if ($tracked.Count -gt 0) {
            $tracked | ForEach-Object { Write-Host $_ }
            throw 'Tracked source changed during verification.'
          }

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-test-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/novelty01_preflight.json
            artifacts/release_x64_build.log
            artifacts/native_self_test.log
            artifacts/shader_self_test.log
            bin/Release/HairSystem/*.log
            bin-int/Release/HairSystem/*.log

  formal-gpu-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.run_formal_smoke
    runs-on: [self-hosted, Windows, X64, RTX4070TiSUPER, HairSystem]
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      PYTHONHASHSEED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Run P/S01 100k readiness smoke
        shell: pwsh
        run: |
          powershell.exe `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File tools\final_stage\Run_Novelty01_Readiness_Smoke.ps1 `
            -Repo $PWD.Path

      - name: Upload formal smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novelty01-formal-smoke-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            out/novelty01_readiness_smoke_*/**
