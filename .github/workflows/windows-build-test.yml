name: Windows Build and Test

on:
  pull_request:
    branches: [prenovelty-ready]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix-hairsim-runtime-compile:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore long-run validation payload
        shell: pwsh
        run: |
          @'
          import base64
          import zipfile
          from pathlib import Path

          parts = sorted(Path('.ci_payload').glob('longrun_payload.b64.part*'))
          if not parts:
              raise SystemExit('long-run payload parts are missing')
          encoded = ''.join(path.read_text(encoding='ascii') for path in parts)
          archive = Path('longrun_ci_payload.zip')
          archive.write_bytes(base64.b64decode(encoded, validate=True))
          with zipfile.ZipFile(archive) as source:
              source.extractall('.')
          '@ | Set-Content -Encoding UTF8 restore_longrun_payload.py
          python restore_longrun_payload.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply stable benchmark wig prerequisite
        shell: pwsh
        run: |
          git fetch origin chatgpt/stable-benchmark-wig-20260721 --no-tags
          git show origin/chatgpt/stable-benchmark-wig-20260721:tools/final_stage/chatgpt_stable_benchmark_wig_patch.py | Set-Content -Encoding UTF8 tools\final_stage\apply_stable_benchmark_wig.py
          python tools\final_stage\apply_stable_benchmark_wig.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply inextensible stretch prerequisite
        shell: pwsh
        run: |
          git fetch origin chatgpt/inextensible-stretch-guard-20260721 --no-tags
          git show origin/chatgpt/inextensible-stretch-guard-20260721:tools/final_stage/chatgpt_inextensible_stretch_guard_patch.py | Set-Content -Encoding UTF8 tools\final_stage\apply_inextensible_stretch_guard.py
          python tools\final_stage\apply_inextensible_stretch_guard.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply long-run stability correction
        shell: pwsh
        run: |
          python tools\final_stage\chatgpt_long_run_hair_stability_patch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove duplicate attributes and loop-variable conflicts
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          path = Path('apps/dx11_viewer/shaders/HairSim.hlsl')
          text = path.read_text(encoding='utf-8')

          duplicate_pattern = re.compile(
              r'(\[numthreads\([^\n]+\)\])\s*\n\s*\1'
          )
          text, duplicate_count = duplicate_pattern.subn(r'\1', text)
          if duplicate_count != 5:
              raise RuntimeError(
                  f'Expected 5 duplicate numthreads pairs, observed {duplicate_count}'
              )

          replacements = [
              (
                  'for (uint i = 1u; i < ParticlesPerStrand; ++i)\n'
                  '    {\n'
                  '        uint previousIndex = start + i - 1u;\n'
                  '        uint currentIndex = start + i;\n'
                  '        float3 restParent = RestPositions[previousIndex].xyz;',
                  'for (uint scanIndex = 1u; scanIndex < ParticlesPerStrand; ++scanIndex)\n'
                  '    {\n'
                  '        uint previousIndex = start + scanIndex - 1u;\n'
                  '        uint currentIndex = start + scanIndex;\n'
                  '        float3 restParent = RestPositions[previousIndex].xyz;',
              ),
              (
                  'for (uint i = 1u; i < ParticlesPerStrand; ++i)\n'
                  '        {\n'
                  '            uint pointIndex = start + i;\n',
                  'for (uint recoveryIndex = 1u; recoveryIndex < ParticlesPerStrand; ++recoveryIndex)\n'
                  '        {\n'
                  '            uint pointIndex = start + recoveryIndex;\n',
              ),
              (
                  'for (uint i = 1u; i < ParticlesPerStrand; ++i)\n'
                  '    {\n'
                  '        uint previousIndex = start + i - 1u;\n'
                  '        uint currentIndex = start + i;\n'
                  '        float3 parent = OutputPositions[previousIndex].xyz;',
                  'for (uint clampIndex = 1u; clampIndex < ParticlesPerStrand; ++clampIndex)\n'
                  '    {\n'
                  '        uint previousIndex = start + clampIndex - 1u;\n'
                  '        uint currentIndex = start + clampIndex;\n'
                  '        float3 parent = OutputPositions[previousIndex].xyz;',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise RuntimeError(f'Loop-variable correction anchor missing: {old[:80]!r}')
              text = text.replace(old, new, 1)

          if duplicate_pattern.search(text):
              raise RuntimeError('A duplicate numthreads pair remains after correction')

          expected_entries = [
              'RootBindCS',
              'IntegrateCS',
              'ClearConstraintLambdasCS',
              'DistanceCS',
              'StabilityGuardCS',
              'BendCS',
              'CollisionCS',
              'ClearGridCS',
              'BuildGridCS',
              'ClearHashGridCS',
              'BuildHashGridCS',
              'ClearSortedRangesCS',
              'BuildSortedEntriesCS',
              'BitonicSortCS',
              'BuildSortedRangesCS',
              'SelfCollisionCS',
              'FollowCS',
          ]
          for entry in expected_entries:
              pattern = re.compile(
                  r'\[numthreads\([^\n]+\)\]\s*\n\s*void\s+' +
                  re.escape(entry) + r'\s*\('
              )
              if len(pattern.findall(text)) != 1:
                  raise RuntimeError(
                      f'{entry} must have exactly one numthreads attribute'
                  )

          path.write_text(text, encoding='utf-8', newline='\n')
          Path('hairsim_duplicate_numthreads_modified_files.txt').write_text(
              'apps/dx11_viewer/shaders/HairSim.hlsl\n',
              encoding='utf-8',
          )
          '@ | Set-Content -Encoding UTF8 fix_hairsim_runtime_compile.py
          python fix_hairsim_runtime_compile.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply Viewer foundation dedup prerequisite
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          def remove_function(path: str, signature: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              start = text.find(signature)
              if start < 0:
                  return
              line_start = text.rfind('\n', 0, start) + 1
              brace = text.find('{', start)
              if brace < 0:
                  raise RuntimeError(f'opening brace missing for {signature}')
              depth = 0
              end = brace
              while end < len(text):
                  if text[end] == '{':
                      depth += 1
                  elif text[end] == '}':
                      depth -= 1
                      if depth == 0:
                          end += 1
                          while end < len(text) and text[end] in ' \t\r\n':
                              end += 1
                          break
                  end += 1
              if depth != 0:
                  raise RuntimeError(f'unbalanced body for {signature}')
              p.write_text(text[:line_start] + text[end:], encoding='utf-8', newline='\n')

          remove_function('apps/dx11_viewer/src/GpuHairViewer_parts/01_window_device_and_ui_setup.inl', 'bool GpuHairViewer::CreateUiControls()')
          remove_function('apps/dx11_viewer/src/GpuHairViewer_parts/06_render_mesh_and_visibility_recovery.inl', 'bool GpuHairViewer::CompileShaderFromFile(')
          remove_function('apps/dx11_viewer/src/GpuHairViewer_parts/06_render_mesh_and_visibility_recovery.inl', 'GpuHairViewer::StructuredBuffer GpuHairViewer::CreateStructuredBuffer(')
          remove_function('apps/dx11_viewer/src/GpuHairViewer_parts/06_render_mesh_and_visibility_recovery.inl', 'RECT GpuHairViewer::GetRenderViewportRect() const')
          remove_function('apps/dx11_viewer/src/GpuHairViewer_parts/08_ui_state_sync_and_controls.inl', 'void GpuHairViewer::ApplyWorkspaceMode(')
          remove_function('apps/dx11_viewer/src/GpuHairViewer_parts/08_ui_state_sync_and_controls.inl', 'void GpuHairViewer::ApplyGroomToolPreset(')
          remove_function('apps/dx11_viewer/src/GpuHairViewer_parts/08_ui_state_sync_and_controls.inl', 'const wchar_t* GpuHairViewer::GetWorkspaceDisplayName() const')

          for path in [
              'apps/dx11_viewer/src/GpuHairViewer_parts/07_draw_path_and_gpu_timing.inl',
              'apps/dx11_viewer/src/GpuHairViewer_parts/11_experiment_env_and_performance_sample.inl',
              'apps/dx11_viewer/src/GpuHairViewer_parts/12_strand_pick_gizmo_and_brush_edit.inl',
              'apps/dx11_viewer/src/GpuHairViewer_parts/14_scalp_overlay_and_window_messages.inl',
          ]:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              text = re.sub(r'=\s*GetRenderViewportRect\s*;', '= this->GetRenderViewportRect();', text)
              p.write_text(text, encoding='utf-8', newline='\n')

          p = Path('apps/dx11_viewer/src/GpuHairViewer_parts/09_settings_load_save_and_export.inl')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'\+\s*GetWorkspaceDisplayName\s*(?!\()', '+ this->GetWorkspaceDisplayName()', text)
          p.write_text(text, encoding='utf-8', newline='\n')
          '@ | Set-Content -Encoding UTF8 apply_viewer_dedup.py
          python apply_viewer_dedup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile every HairSim compute entry with FXC
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter fxc.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $fxc) { throw "fxc.exe was not found" }

          $shader = Resolve-Path "apps\dx11_viewer\shaders\HairSim.hlsl"
          $output = Join-Path $PWD "fxc_output"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $entries = @(
            "RootBindCS",
            "IntegrateCS",
            "ClearConstraintLambdasCS",
            "DistanceCS",
            "StabilityGuardCS",
            "BendCS",
            "CollisionCS",
            "ClearGridCS",
            "BuildGridCS",
            "ClearHashGridCS",
            "BuildHashGridCS",
            "ClearSortedRangesCS",
            "BuildSortedEntriesCS",
            "BitonicSortCS",
            "BuildSortedRangesCS",
            "SelfCollisionCS",
            "FollowCS"
          )
          foreach ($entry in $entries) {
            Write-Host "Compiling $entry"
            & $fxc.FullName /nologo /Ges /WX /T cs_5_0 /E $entry /Fo "$output\$entry.cso" $shader 2>&1 | Tee-Object -FilePath hairsim_fxc.log -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Resolve MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild was not found" }
          "MSBUILD_EXE=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Release x64 build
        shell: pwsh
        run: |
          & "$env:MSBUILD_EXE" HairSystem.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:HairGpuStep0ProfileEnabled=false /p:HairGpuFormalBuild=true /p:HairGpuFormalSelfTest=false 2>&1 | Tee-Object hairsim_fix_msbuild.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }

      - name: Native and shader self-tests
        shell: pwsh
        run: |
          & .\bin\Release\HairSystem\HairSystem.exe --native-self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\bin\Release\HairSystem\HairSystem.exe --shader-self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Python tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests\final_stage -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package only the corrected file
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path hairsim_duplicate_numthreads_modified_files.txt)) { throw "Modified-file manifest missing" }
          $stage = Join-Path $PWD "hairsim_fix_package"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-Content hairsim_duplicate_numthreads_modified_files.txt | ForEach-Object {
            $src = Join-Path $PWD $_
            if (-not (Test-Path $src)) { throw "Package source missing: $_" }
            $dst = Join-Path $stage $_
            New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
            Copy-Item $src $dst -Force
          }
          Compress-Archive -Path "$stage\*" -DestinationPath HairSystem_HairSim_Runtime_Compile_Fix_1_File.zip -Force
          (Get-FileHash HairSystem_HairSim_Runtime_Compile_Fix_1_File.zip -Algorithm SHA256).Hash | Set-Content HairSystem_HairSim_Runtime_Compile_Fix_1_File.sha256

      - name: Upload corrected file and verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HairSystem-HairSim-Runtime-Compile-Fix-1-File
          if-no-files-found: error
          retention-days: 7
          path: |
            HairSystem_HairSim_Runtime_Compile_Fix_1_File.zip
            HairSystem_HairSim_Runtime_Compile_Fix_1_File.sha256
            hairsim_duplicate_numthreads_modified_files.txt
            hairsim_fxc.log
            hairsim_fix_msbuild.log
