name: Windows Build and Test

on:
  pull_request:
    branches: [prenovelty-ready]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-debug-evidence:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply local debugger evidence patch
        shell: pwsh
        run: |
          python tools\final_stage\chatgpt_local_debug_evidence_patch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools\final_stage\chatgpt_fix_local_debug_appmain.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply Viewer foundation dedup prerequisite
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          def remove_function(path: str, signature: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              start = text.find(signature)
              if start < 0:
                  return
              line_start = text.rfind("\n", 0, start) + 1
              brace = text.find("{", start)
              if brace < 0:
                  raise RuntimeError(f"opening brace missing for {signature} in {path}")
              depth = 0
              end = brace
              while end < len(text):
                  if text[end] == "{":
                      depth += 1
                  elif text[end] == "}":
                      depth -= 1
                      if depth == 0:
                          end += 1
                          while end < len(text) and text[end] in " \t\r\n":
                              end += 1
                          break
                  end += 1
              if depth != 0:
                  raise RuntimeError(f"unbalanced function body for {signature} in {path}")
              file_path.write_text(text[:line_start] + text[end:], encoding="utf-8", newline="\n")

          remove_function(
              "apps/dx11_viewer/src/GpuHairViewer_parts/01_window_device_and_ui_setup.inl",
              "bool GpuHairViewer::CreateUiControls()",
          )
          remove_function(
              "apps/dx11_viewer/src/GpuHairViewer_parts/06_render_mesh_and_visibility_recovery.inl",
              "bool GpuHairViewer::CompileShaderFromFile(",
          )
          remove_function(
              "apps/dx11_viewer/src/GpuHairViewer_parts/06_render_mesh_and_visibility_recovery.inl",
              "GpuHairViewer::StructuredBuffer GpuHairViewer::CreateStructuredBuffer(",
          )
          remove_function(
              "apps/dx11_viewer/src/GpuHairViewer_parts/06_render_mesh_and_visibility_recovery.inl",
              "RECT GpuHairViewer::GetRenderViewportRect() const",
          )
          remove_function(
              "apps/dx11_viewer/src/GpuHairViewer_parts/08_ui_state_sync_and_controls.inl",
              "void GpuHairViewer::ApplyWorkspaceMode(",
          )
          remove_function(
              "apps/dx11_viewer/src/GpuHairViewer_parts/08_ui_state_sync_and_controls.inl",
              "void GpuHairViewer::ApplyGroomToolPreset(",
          )
          remove_function(
              "apps/dx11_viewer/src/GpuHairViewer_parts/08_ui_state_sync_and_controls.inl",
              "const wchar_t* GpuHairViewer::GetWorkspaceDisplayName() const",
          )

          for path in [
              "apps/dx11_viewer/src/GpuHairViewer_parts/07_draw_path_and_gpu_timing.inl",
              "apps/dx11_viewer/src/GpuHairViewer_parts/11_experiment_env_and_performance_sample.inl",
              "apps/dx11_viewer/src/GpuHairViewer_parts/12_strand_pick_gizmo_and_brush_edit.inl",
              "apps/dx11_viewer/src/GpuHairViewer_parts/14_scalp_overlay_and_window_messages.inl",
          ]:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              text = re.sub(
                  r"=\s*GetRenderViewportRect\s*;",
                  "= this->GetRenderViewportRect();",
                  text,
              )
              file_path.write_text(text, encoding="utf-8", newline="\n")

          settings_path = Path("apps/dx11_viewer/src/GpuHairViewer_parts/09_settings_load_save_and_export.inl")
          settings_text = settings_path.read_text(encoding="utf-8")
          settings_text = re.sub(
              r"\+\s*GetWorkspaceDisplayName\s*(?!\()",
              "+ this->GetWorkspaceDisplayName()",
              settings_text,
          )
          settings_path.write_text(settings_text, encoding="utf-8", newline="\n")
          '@ | Set-Content -Encoding UTF8 apply_viewer_dedup.py
          python apply_viewer_dedup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate project XML and Python syntax
        shell: pwsh
        run: |
          python -c "import xml.etree.ElementTree as ET; ET.parse('HairSystem.vcxproj')"
          python -m py_compile tools\final_stage\hairgpu_local_debug_report.py tests\final_stage\test_hairgpu_local_debug_report.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild was not found" }
          "MSBUILD_EXE=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Release x64 build
        shell: pwsh
        run: |
          & "$env:MSBUILD_EXE" HairSystem.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:HairGpuStep0ProfileEnabled=false /p:HairGpuFormalBuild=true /p:HairGpuFormalSelfTest=false 2>&1 | Tee-Object local_debug_msbuild.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }

      - name: Native and shader self-tests
        shell: pwsh
        run: |
          & .\bin\Release\HairSystem\HairSystem.exe --native-self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\bin\Release\HairSystem\HairSystem.exe --shader-self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Python tests
        shell: pwsh
        run: |
          python -m unittest tests.final_stage.test_hairgpu_local_debug_report -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests\final_stage -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package only the seven requested files
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path local_debug_evidence_modified_files.txt)) { throw "Package manifest is missing" }
          $stage = Join-Path $PWD "local_debug_evidence_package"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-Content local_debug_evidence_modified_files.txt | ForEach-Object {
            $source = Join-Path $PWD $_
            $destination = Join-Path $stage $_
            New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
            Copy-Item $source $destination -Force
          }
          Compress-Archive -Path "$stage\*" -DestinationPath HairSystem_Local_Debug_Evidence_7_Files.zip -Force
          (Get-FileHash HairSystem_Local_Debug_Evidence_7_Files.zip -Algorithm SHA256).Hash | Set-Content HairSystem_Local_Debug_Evidence_7_Files.sha256

      - name: Upload local-debug package and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HairSystem-Local-Debug-Evidence-7-Files
          if-no-files-found: error
          retention-days: 7
          path: |
            HairSystem_Local_Debug_Evidence_7_Files.zip
            HairSystem_Local_Debug_Evidence_7_Files.sha256
            local_debug_evidence_modified_files.txt
            local_debug_msbuild.log
