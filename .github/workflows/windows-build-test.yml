name: Windows Build and Test

on:
  push:
    branches:
      - Novelty
      - "agent/**"
  pull_request:
    branches:
      - Novelty
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-x64:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONHASHSEED: "0"
      HAIRGPU_ALLOW_REVIEW_BRANCH: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        shell: cmd
        run: |
          if not exist build_check mkdir build_check
          msbuild HairSystem.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:HairGpuStep0ProfileEnabled=false /p:HairGpuFormalBuild=true /fl /flp:logfile=build_check\msbuild-release-x64.log;verbosity=diagnostic

      - name: Native ABI and workload self-test
        shell: cmd
        run: bin\Release\HairSystem\HairSystem.exe --native-self-test

      - name: Export canonical frozen source
        shell: cmd
        run: bin\Release\HairSystem\HairSystem.exe --export-frozen-source build_check\canonical_source

      - name: Validate canonical frozen source round trip
        shell: cmd
        run: bin\Release\HairSystem\HairSystem.exe --validate-frozen-source build_check\canonical_source

      - name: HLSL load and compile self-test
        shell: cmd
        run: bin\Release\HairSystem\HairSystem.exe --shader-self-test

      - name: Compile Python tools
        shell: cmd
        run: >-
          python -m py_compile
          tools\final_stage\freeze_novelty01_asset.py
          tools\final_stage\hairgpu_final_run.py
          tools\final_stage\hairgpu_runtime_suite.py
          tools\final_stage\hairgpu_safe_runtime_suite.py
          tools\final_stage\hairgpu_final_db.py
          tools\final_stage\hairgpu_final_excel.py
          tools\final_stage\hairgpu_formal_gate.py
          tools\final_stage\hairgpu_final_run\__init__.py
          tools\final_stage\hairgpu_runtime_suite\__init__.py

      - name: Run Python self-tests
        shell: cmd
        run: |
          python tools\final_stage\hairgpu_final_run.py --self-test
          python tools\final_stage\hairgpu_runtime_suite.py --self-test
          python tools\final_stage\hairgpu_formal_gate.py --self-test

      - name: Run final-stage unit tests
        shell: cmd
        run: |
          python -m unittest discover -s tests\final_stage -p "test_*.py" -v > build_check\unittest.log 2>&1
          set "TEST_EXIT=%ERRORLEVEL%"
          type build_check\unittest.log
          exit /b %TEST_EXIT%

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build_check\**
            bin\Release\HairSystem\*.log
            bin-int\Release\HairSystem\**\*.log
            out\**
