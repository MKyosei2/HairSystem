name: Publish Prenovelty ZIP Run ID

on:
  push:
    branches:
      - chatgpt-temp-prenovelty-14files-20260720
    paths-ignore:
      - .chatgpt_artifact_run_id

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record run ID
        shell: bash
        run: |
          echo "$GITHUB_RUN_ID" > .chatgpt_artifact_run_id
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .chatgpt_artifact_run_id
          git commit -m "record temporary artifact run id"
          git push
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate corrected ZIP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/chatgpt-build-prenovelty-14files.yml').read_text(encoding='utf-8')
          begin_token = "          python - <<'PY'\n"
          end_token = "\n          PY\n"
          begin = source.index(begin_token) + len(begin_token)
          end = source.index(end_token, begin)
          script = textwrap.dedent(source[begin:end]) + "\n"
          Path('chatgpt_generate_prenovelty_zip.py').write_text(script, encoding='utf-8')
          PY
          python chatgpt_generate_prenovelty_zip.py
      - name: Upload corrected source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HairSystem-Prenovelty-14-Files
          path: HairSystem_Prenovelty_14_Files.zip
          if-no-files-found: error
          retention-days: 7
