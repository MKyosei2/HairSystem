name: One Shot Fix Zero Event Contract

on:
  pull_request:
    branches:
      - Novelty

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.pull_request.head.sha, 'never-match') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      # This workflow exists only to make one exact edit in a large split INL.
      - name: Apply exact source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/dx11_viewer/src/GpuHairViewer_parts/10_phase1_telemetry_csv_jsonl_summary.inl")
          text = path.read_text(encoding="utf-8")
          old = '''        m_experimentCase.scenarioAssertionMinAppliedEvents = std::max<uint32_t>(1u,
              assertions->UInt({ "min_applied_events", "minAppliedEvents" }, 0u));'''
          new = '''        // Zero-event scenarios such as Idle, Breathing and Walk are valid.
          // Event-bearing scenarios declare their own positive minimum in the case JSON.
          m_experimentCase.scenarioAssertionMinAppliedEvents =
              assertions->UInt({ "min_applied_events", "minAppliedEvents" }, 0u);'''
          count = text.count(old)
          if count == 0 and "Zero-event scenarios such as Idle" in text:
              print("Native event contract is already fixed.")
          elif count == 1:
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          else:
              raise SystemExit(f"Expected zero or one native event-contract target, found {count}")
          PY

      - name: Commit exact patch when needed
        shell: bash
        run: |
          if git diff --quiet -- apps/dx11_viewer/src/GpuHairViewer_parts/10_phase1_telemetry_csv_jsonl_summary.inl; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dx11_viewer/src/GpuHairViewer_parts/10_phase1_telemetry_csv_jsonl_summary.inl
          git commit -m "[zero-event-contract-fixed] Allow valid zero-event scenarios"
          git push origin HEAD:agent/complete-test-environment
