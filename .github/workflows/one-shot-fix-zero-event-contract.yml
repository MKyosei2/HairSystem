name: One Shot Fix Zero Event Contract

on:
  pull_request:
    branches:
      - Novelty

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      # This workflow exists only to make one structurally exact edit in a large split INL.
      - name: Apply exact source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("apps/dx11_viewer/src/GpuHairViewer_parts/10_phase1_telemetry_csv_jsonl_summary.inl")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"(?P<indent>^[ \t]*)m_experimentCase\.scenarioAssertionMinAppliedEvents\s*=\s*"
              r"std::max<uint32_t>\(\s*1u\s*,\s*"
              r"assertions->UInt\(\s*\{\s*\"min_applied_events\"\s*,\s*"
              r"\"minAppliedEvents\"\s*\}\s*,\s*0u\s*\)\s*\)\s*;",
              re.MULTILINE,
          )
          matches = list(pattern.finditer(text))
          if not matches and "Zero-event scenarios such as Idle" in text:
              print("Native event contract is already fixed.")
          elif len(matches) == 1:
              indent = matches[0].group("indent")
              replacement = (
                  f"{indent}// Zero-event scenarios such as Idle, Breathing and Walk are valid.\n"
                  f"{indent}// Event-bearing scenarios declare their own positive minimum in the case JSON.\n"
                  f"{indent}m_experimentCase.scenarioAssertionMinAppliedEvents =\n"
                  f"{indent}    assertions->UInt({{ \"min_applied_events\", \"minAppliedEvents\" }}, 0u);"
              )
              path.write_text(pattern.sub(replacement, text, count=1), encoding="utf-8", newline="\n")
          else:
              raise SystemExit(f"Expected zero or one native event-contract target, found {len(matches)}")
          PY

      - name: Commit exact patch when needed
        shell: bash
        run: |
          if git diff --quiet -- apps/dx11_viewer/src/GpuHairViewer_parts/10_phase1_telemetry_csv_jsonl_summary.inl; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dx11_viewer/src/GpuHairViewer_parts/10_phase1_telemetry_csv_jsonl_summary.inl
          git commit -m "[zero-event-contract-fixed] Allow valid zero-event scenarios"
          git push origin HEAD:agent/complete-test-environment
