name: Formal GPU Regression

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Formal suite mode on the actual RTX 4070 Ti SUPER host
        required: true
        default: prenovelty-complete
        type: choice
        options:
          - prenovelty-smoke
          - prenovelty-complete
          - prenovelty-soak30
          - startup20
          - proposal-smoke
          - comparison-smoke
          - critical
          - determinism
          - soak30
          - soak2h
          - soak8h
          - full
          - phase13-full
          - projection4070-to-1660

permissions:
  contents: read

concurrency:
  group: formal-gpu-regression-rtx4070ti-super
  cancel-in-progress: false

jobs:
  formal-rtx4070ti-super:
    runs-on: [self-hosted, Windows, X64, HairSystem, RTX4070TiSUPER]
    timeout-minutes: 600
    env:
      PYTHONUTF8: "1"
      PYTHONHASHSEED: "0"
      HAIRGPU_FREEZE_OPERATOR: GitHub_Actions_RTX4070TiSUPER
      HAIRGPU_ALLOW_REVIEW_BRANCH: "1"
      HAIRGPU_HARDWARE_PROFILE: measurement_rtx4070ti_super

    steps:
      - name: Checkout clean source state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fixed analysis dependency
        shell: cmd
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Run pre-novelty phase
        if: startsWith(inputs.mode, 'prenovelty-') || inputs.mode == 'startup20'
        shell: cmd
        run: >-
          tools\final_stage\Run_Final_Runtime_Suite.bat
          docs\sample_assets\prenovelty_runtime_suite.json
          ${{ inputs.mode }}
          out\prenovelty_baseline

      - name: Run proposal/final phase or projection
        if: ${{ !(startsWith(inputs.mode, 'prenovelty-') || inputs.mode == 'startup20') }}
        shell: cmd
        run: >-
          tools\final_stage\Run_Final_Runtime_Suite.bat
          docs\sample_assets\final_runtime_suite_template.json
          ${{ inputs.mode }}
          out\novelty01_baseline

      - name: Verify pre-novelty complete package exists
        if: always() && inputs.mode == 'prenovelty-complete'
        shell: cmd
        run: |
          if not exist "out\prenovelty_baseline\complete_manifest.json" exit /b 1
          if not exist "out\prenovelty_baseline\prenovelty_complete_evidence.zip" exit /b 1
          if not exist "out\prenovelty_baseline\prenovelty_complete_evidence.zip.sha256" exit /b 1
          if not exist "out\prenovelty_baseline\frozen_asset_bundle_snapshot.zip" exit /b 1
          if not exist "out\prenovelty_baseline\analysis\validated_evidence.sqlite" exit /b 1
          if not exist "out\prenovelty_baseline\analysis\formal_results.xlsx" exit /b 1
          if not exist "out\prenovelty_baseline\analysis\graphs\method_average_fps.svg" exit /b 1
          python -c "import json,pathlib; p=json.loads(pathlib.Path(r'out\prenovelty_baseline\complete_manifest.json').read_text(encoding='utf-8-sig')); raise SystemExit(0 if p.get('status') == 'COMPLETE' and p.get('passed') is True else 1)"

      - name: Upload actual RTX evidence and frozen workload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtx4070ti-super-${{ inputs.mode }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
          path: |
            out\prenovelty_baseline\**
            out\novelty01_baseline\**
            benchmarks\novelty01\frozen_asset_bundle\**
